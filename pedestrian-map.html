<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedestrian paths · OpenStreetMap + Leaflet</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root {
    --bg: #fbfbf9; --fg: #1d2530; --muted: #5d6877; --line: #d9dde3; --accent: #1f6f78;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a2028; --fg: #e8ecf1; --muted: #9aa5b4; --line: #333d4a; --accent: #5cc4cf; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #routeForm { flex: 3 1 560px; max-width: 820px; flex-wrap: wrap; }
  #routeForm input[type=text] { flex: 1 1 170px; min-width: 0; }
  form { display: flex; gap: 6px; flex: 1 1 280px; max-width: 480px; }
  input[type=text] { flex: 1; padding: 8px 10px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 8px 12px; font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
  button.secondary { color: var(--fg); background: transparent; border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 13px; flex: 1 1 100%; min-height: 1.4em; }
  #map { flex: 1; min-height: 0; }
  .legend { background: var(--bg); color: var(--fg); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; line-height: 1.7; }
  .legend label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .opt { font-size: 13px; color: var(--fg); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .leaflet-container.routing { cursor: crosshair; }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .swatch { width: 22px; height: 0; border-top: 4px solid; }
  .swatch.dashed { border-top-style: dashed; }
</style>
</head>
<body>
<header>
  <form id="routeForm">
    <input id="from" type="text" placeholder="From: address, place, or lat, lon" aria-label="Origin" autocomplete="off">
    <button id="swap" type="button" class="secondary" title="Swap origin and destination" aria-label="Swap">⇄</button>
    <input id="to" type="text" placeholder="To: address, place, or lat, lon" aria-label="Destination" autocomplete="off">
    <button id="routeGo" type="submit">Route</button>
    <button id="pick" type="button" class="secondary" title="Click the map to set A, then B">Pick on map</button>
  </form>
  <form id="search">
    <input id="city" type="text" placeholder="City name, e.g. Lisbon" aria-label="City name" required>
    <button id="go" type="submit">Show paths</button>
  </form>
  <button id="view" class="secondary" type="button" title="Load paths for the area currently on screen">Load current view</button>
  <label class="opt" title="Never use stairs (unless tagged with a wheelchair ramp) or ways tagged wheelchair=no"><input type="checkbox" id="optSteps"> Step-free</label>
  <label class="opt" title="Use elevation: uphill and steep downhill cost more (Tobler hiking function)"><input type="checkbox" id="optHills"> Weigh hills</label>
  <div id="status" role="status">Type an origin and a destination, or turn on “Pick on map” and click. Use the city box to show the path overview.</div>
</header>
<div id="map"></div>

<script src="vendor/leaflet.js"></script>
<script>
/* ---------- 1. Base map ---------- */
const map = L.map('map', { preferCanvas: true }).setView([48.2082, 16.3738], 12);

// Official OSM tiles require a Referer header, so this page must be served over http(s)
// (e.g. http://localhost:8000 or a real website), not opened as a file:// URL.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  referrerPolicy: 'strict-origin-when-cross-origin',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

if (location.protocol === 'file:') {
  document.getElementById('status').textContent =
    'Opened from a file: OSM tiles and search will be blocked. Serve this folder over http (see the note in the code).';
}

/* ---------- 2. Path categories (what counts as "pedestrian") ---------- */
const CATEGORIES = {
  footway:    { label: 'Footways',            color: '#d1495b', weight: 2.5, on: true  },
  pedestrian: { label: 'Pedestrian streets',  color: '#6a4c93', weight: 3,   on: true  },
  path:       { label: 'Paths',               color: '#2e8b57', weight: 2.5, on: true  },
  steps:      { label: 'Steps',               color: '#e08e0b', weight: 3,   on: true,  dash: '4 4' },
  crossing:   { label: 'Crossings',           color: '#2b7bb9', weight: 2,   on: true },
  sidewalk:   { label: 'Sidewalks', color: '#3d3c3f', weight: 1.5, on: true }
};
const groups = {};
for (const key in CATEGORIES) {
  groups[key] = L.layerGroup();
  if (CATEGORIES[key].on) groups[key].addTo(map);
}

function categorize(tags) {
  if (tags.highway === 'footway') {
    if (tags.footway === 'sidewalk') return 'sidewalk';
    if (tags.footway === 'crossing') return 'crossing';
    return 'footway';
  }
  return tags.highway; // pedestrian | path | steps
}

/* ---------- 3. Legend with on/off toggles ---------- */
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  for (const key in CATEGORIES) {
    const c = CATEGORIES[key];
    const row = L.DomUtil.create('label', '', div);
    row.innerHTML =
      `<input type="checkbox" ${c.on ? 'checked' : ''}>` +
      `<span class="swatch ${c.dash ? 'dashed' : ''}" style="border-color:${c.color}"></span>${c.label}`;
    row.querySelector('input').addEventListener('change', e =>
      e.target.checked ? groups[key].addTo(map) : map.removeLayer(groups[key]));
  }
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);

/* ---------- 4. Geocode the city (Nominatim) ---------- */
async function geocode(name) {
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' + encodeURIComponent(name);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('Geocoding failed (' + res.status + ')');
  const hits = await res.json();
  if (!hits.length) throw new Error('No place found for “' + name + '”.');
  // Prefer an administrative boundary (relation) so we can query by area
  return hits.find(h => h.osm_type === 'relation') || hits[0];
}

/* ---------- 5. Load ways from the local file ---------- */
const DATA_URL = 'data/city.json';
const HIGHWAYS = 'footway|pedestrian|path|steps';
const PED = new Set(HIGHWAYS.split('|'));
const NOT_WALKABLE = new Set(['motorway', 'motorway_link', 'trunk', 'trunk_link',
  'bridleway', 'proposed', 'construction', 'raceway', 'bus_guideway', 'escape']);

const isPed = t => PED.has(t.highway);
const isWalkable = t => t.highway && !NOT_WALKABLE.has(t.highway) && t.foot !== 'no' && t.access !== 'private';

let allWays = null; // parsed once, then reused for every search and route
async function loadWays() {
  if (!allWays) {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('Could not load ' + DATA_URL + ' (' + res.status + '). Serve the folder over http.');
    allWays = (await res.json()).elements.filter(el => el.type === 'way' && el.geometry);
  }
  return allWays;
}

// Does any point of the way fall inside the box? (bounds check first as a quick reject)
function inBox(way, s, w, n, e) {
  const b = way.bounds;
  if (b && (b.maxlat < s || b.minlat > n || b.maxlon < w || b.minlon > e)) return false;
  return way.geometry.some(p => p && p.lat >= s && p.lat <= n && p.lon >= w && p.lon <= e);
}

// Overview: pedestrian ways only
const queryByArea = async () => (await loadWays()).filter(x => isPed(x.tags || {}));
const queryByBbox = async (s, w, n, e) =>
  (await loadWays()).filter(x => isPed(x.tags || {}) && inBox(x, s, w, n, e));

// Routing: pedestrian ways plus ordinary walkable streets
const queryWalkable = async (s, w, n, e) =>
  (await loadWays()).filter(x => { const t = x.tags || {}; return (isPed(t) || isWalkable(t)) && inBox(x, s, w, n, e); });

/* ---------- 6. Draw ---------- */
function clearPaths() { for (const k in groups) groups[k].clearLayers(); }

function draw(ways) {
  clearPaths();
  const counts = {};
  for (const w of ways) {
    if (!w.geometry) continue;
    const tags = w.tags || {};
    const cat = categorize(tags);
    const style = CATEGORIES[cat];
    if (!style) continue;
    counts[cat] = (counts[cat] || 0) + 1;

    const line = L.polyline(w.geometry.map(p => [p.lat, p.lon]), {
      color: style.color, weight: style.weight, opacity: 0.9, dashArray: style.dash || null
    });
    const rows = ['name', 'highway', 'surface', 'width', 'incline', 'lit', 'wheelchair']
      .filter(k => tags[k]).map(k => `<b>${k}</b>: ${escapeHtml(tags[k])}`).join('<br>');
    const html = `${rows || 'unnamed way'}<br><a href="https://www.openstreetmap.org/way/${w.id}" target="_blank" rel="noopener">View on OSM</a>`;
    // In route mode the click belongs to routing; the feature popup only opens when route mode is off.
    line.on('click', ev => { if (!routeMode) L.popup().setLatLng(ev.latlng).setContent(html).openOn(map); });
    groups[cat].addLayer(line);
  }
  return counts;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 7. UI wiring ---------- */
const statusEl = document.getElementById('status');
const buttons = ['go', 'view', 'routeGo'].map(id => document.getElementById(id));
const setBusy = (busy, msg) => { buttons.forEach(b => b.disabled = busy); statusEl.textContent = msg; };

function summary(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return total
    ? `Loaded ${total.toLocaleString()} ways. ` + Object.entries(counts).map(([k, v]) => `${CATEGORIES[k].label}: ${v.toLocaleString()}`).join(' · ')
    : 'No pedestrian ways found here.';
}

document.getElementById('search').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('city').value.trim();
  if (!name) return;
  try {
    setBusy(true, 'Finding ' + name + '…');
    const place = await geocode(name);
    const [s, n, w, ea] = place.boundingbox.map(Number);
    map.fitBounds([[s, w], [n, ea]]);

    setBusy(true, 'Downloading pedestrian paths (large cities can take a minute)…');
    let ways;
    if (place.osm_type === 'relation')      ways = await queryByArea(3600000000 + Number(place.osm_id));
    else if (place.osm_type === 'way')      ways = await queryByArea(2400000000 + Number(place.osm_id));
    else                                    ways = await queryByBbox(s, w, n, ea);

    setBusy(false, summary(draw(ways)));
  } catch (err) {
    setBusy(false, err.message);
  }
});

document.getElementById('view').addEventListener('click', async () => {
  if (map.getZoom() < 10) { statusEl.textContent = 'Zoom in a little further (level 10+), then try again.'; return; }
  try {
    setBusy(true, 'Downloading paths for this view…');
    const b = map.getBounds();
    const ways = await queryByBbox(b.getSouth(), b.getWest(), b.getNorth(), b.getEast());
    setBusy(false, summary(draw(ways)));
  } catch (err) {
    setBusy(false, err.message);
  }
});

/* ---------- 8. Walking routes between two clicks ---------- */
// Pedestrians can also use ordinary streets, so routing uses a wider "walkable" network than the
// display layers above: every highway except motorways, cycleways etc., and nothing tagged foot=no.
const WALKABLE = 'way["highway"]["highway"!~"^(motorway|motorway_link|trunk|trunk_link|cycleway|bridleway|proposed|construction|raceway|bus_guideway|escape)$"]["foot"!="no"]["access"!="private"]';
const WALK_SPEED = 1.39; // m/s, about 5 km/h
const routeLayer = L.layerGroup().addTo(map);
let routeMode = false; // "Pick on map" mode

const haversine = (a, b) => {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

// Step-free rule: a hard exclusion, not a weight. Steps are allowed only if tagged with a wheelchair ramp.
const stepFreeBlocked = t =>
  (t.highway === 'steps' && t['ramp:wheelchair'] !== 'yes') || t.wheelchair === 'no';

// Tobler's hiking function: walking speed (m/s) falls off with slope, fastest on a slight (-5%) downhill.
const V_MAX = 6 / 3.6;
function toblerTime(d, rise) {
  if (d === 0) return 0;
  const s = Math.max(-0.3, Math.min(0.3, rise / d));
  return d / (6 * Math.exp(-3.5 * Math.abs(s + 0.05)) / 3.6);
}

// Ground elevation is wrong on bridges and tunnels, so interpolate between the way's two ends there.
function wayElevations(w, t) {
  const g = w.geometry;
  const e = g.map(p => (p ? elevAt(p.lat, p.lon) : undefined));
  if ((t.bridge || t.tunnel) && g.length > 1 && !g.includes(null) && e[0] !== undefined && e[e.length - 1] !== undefined) {
    const cum = [0];
    for (let i = 1; i < g.length; i++) cum.push(cum[i - 1] + haversine(g[i - 1], g[i]));
    const total = cum[cum.length - 1] || 1;
    return e.map((_, i) => e[0] + (e[e.length - 1] - e[0]) * cum[i] / total);
  }
  return e;
}

// Ways that share a node id are connected, which is what makes it a graph.
// Each edge is [neighbour, cost, metres]. Cost is metres, or seconds when opt.hills is on (then
// uphill and downhill differ, so a→b and b→a get separate costs).
function buildGraph(ways, opt = {}) {
  const nodes = new Map();
  const get = (id, p) => {
    if (!nodes.has(id)) nodes.set(id, { id, lat: p.lat, lon: p.lon, adj: [] });
    return nodes.get(id);
  };
  for (const w of ways) {
    if (!w.nodes || !w.geometry) continue;
    const t = w.tags || {};
    if (opt.stepFree && stepFreeBlocked(t)) continue;
    const ele = opt.hills ? wayElevations(w, t) : null;
    for (let i = 1; i < w.nodes.length; i++) {
      const pa = w.geometry[i - 1], pb = w.geometry[i];
      if (!pa || !pb) continue;
      const a = get(w.nodes[i - 1], pa), b = get(w.nodes[i], pb);
      const d = haversine(a, b);
      let up = d, down = d; // cost a→b, b→a (one-way tags are ignored for walking)
      if (opt.hills) {
        if (ele[i] !== undefined && ele[i - 1] !== undefined) {
          const rise = ele[i] - ele[i - 1];
          up = toblerTime(d, rise); down = toblerTime(d, -rise);
        } else up = down = d / WALK_SPEED;
      }
      a.adj.push([b, up, d]); b.adj.push([a, down, d]);
    }
  }
  return keepLargestComponent(nodes);
}

// Snapping a click to a tiny isolated fragment would make routing fail, so keep only the main network.
function keepLargestComponent(nodes) {
  const seen = new Set(); let best = [];
  for (const start of nodes.values()) {
    if (seen.has(start)) continue;
    const comp = [], stack = [start]; seen.add(start);
    while (stack.length) {
      const u = stack.pop(); comp.push(u);
      for (const [v] of u.adj) if (!seen.has(v)) { seen.add(v); stack.push(v); }
    }
    if (comp.length > best.length) best = comp;
  }
  return best;
}

const nearestNode = (nodes, latlng) => {
  const q = { lat: latlng.lat, lon: latlng.lng };
  let best = null, bd = Infinity;
  for (const n of nodes) { const d = haversine(q, n); if (d < bd) { bd = d; best = n; } }
  return { node: best, dist: bd };
};

// Minimal binary min-heap for the A* open set.
class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item, key) {
    const a = this.a; a.push([key, item]);
    for (let i = a.length - 1; i > 0;) {
      const p = (i - 1) >> 1;
      if (a[p][0] <= a[i][0]) break;
      [a[p], a[i]] = [a[i], a[p]]; i = p;
    }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      for (let i = 0; ;) {
        let l = 2 * i + 1, r = l + 1, m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top[1];
  }
}

// A* with straight-line distance as the heuristic. With hills on, costs are seconds, so the heuristic
// divides by the fastest possible speed and still never overestimates.
function astar(start, goal, opt = {}) {
  const hs = opt.hills ? 1 / V_MAX : 1;
  const g = new Map([[start, 0]]), prev = new Map(), closed = new Set(), open = new Heap();
  open.push(start, haversine(start, goal) * hs);
  while (open.size) {
    const u = open.pop();
    if (u === goal) break;
    if (closed.has(u)) continue;
    closed.add(u);
    for (const [v, c] of u.adj) {
      const ng = g.get(u) + c;
      if (ng < (g.get(v) ?? Infinity)) { g.set(v, ng); prev.set(v, u); open.push(v, ng + haversine(v, goal) * hs); }
    }
  }
  if (start !== goal && !prev.has(goal)) return null;
  const path = [goal];
  for (let u = goal; prev.has(u);) { u = prev.get(u); path.push(u); }
  path.reverse();
  let meters = 0;
  for (let i = 1; i < path.length; i++) meters += haversine(path[i - 1], path[i]);
  return { path, meters, seconds: opt.hills ? g.get(goal) : meters / WALK_SPEED };
}

// ---- elevation: Terrarium DEM tiles, fetched once per area and decoded in the browser ----
const DEM_Z = 13;
const DEM_URL = (z, x, y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`; // swap for a local path to go offline
const demTiles = new Map(); // "x/y" -> RGBA bytes

const demXY = (lat, lon) => {
  const n = 2 ** DEM_Z, r = lat * Math.PI / 180;
  return { x: (lon + 180) / 360 * n, y: (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n };
};

async function loadDemTile(x, y) {
  const key = x + '/' + y;
  if (demTiles.has(key)) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = DEM_URL(DEM_Z, x, y);
  await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  demTiles.set(key, ctx.getImageData(0, 0, 256, 256).data);
}

async function prefetchDem(s, w, n, e) {
  const p = demXY(n, w), q = demXY(s, e), jobs = [];
  for (let x = Math.floor(p.x); x <= Math.floor(q.x); x++)
    for (let y = Math.floor(p.y); y <= Math.floor(q.y); y++) jobs.push(loadDemTile(x, y));
  try { await Promise.all(jobs); }
  catch { throw new Error('Could not load elevation tiles. Untick “Weigh hills”, or check the connection.'); }
}

function elevAt(lat, lon) {
  const { x, y } = demXY(lat, lon), tx = Math.floor(x), ty = Math.floor(y);
  const px = demTiles.get(tx + '/' + ty);
  if (!px) return undefined;
  const i = (Math.min(255, Math.floor((x - tx) * 256)) + 256 * Math.min(255, Math.floor((y - ty) * 256))) * 4;
  return px[i] * 256 + px[i + 1] + px[i + 2] / 256 - 32768; // Terrarium encoding, metres
}

async function computeRoute(a, b, opt = {}) {
  const pad = Math.max(0.003, 0.3 * Math.max(Math.abs(a.lat - b.lat), Math.abs(a.lng - b.lng)));
  const s = Math.min(a.lat, b.lat) - pad, n = Math.max(a.lat, b.lat) + pad;
  const w = Math.min(a.lng, b.lng) - pad, e = Math.max(a.lng, b.lng) + pad;

  //no more distance cap needed
  // if (haversine({ lat: a.lat, lon: a.lng }, { lat: b.lat, lon: b.lng }) > 16000) {
  //   throw new Error('Those points are more than 16 km apart. Pick closer points, or use a routing server (see notes).');
  // }
  // Same local data as the overview: its pedestrian ways plus ordinary walkable streets,
  // so every drawn path is routable.
  if (opt.hills) await prefetchDem(s, w, n, e);
  const ways = await queryWalkable(s, w, n, e);

  const find = o => {
    const nodes = buildGraph(ways, o);
    if (!nodes.length) return null;
    const A = nearestNode(nodes, a), B = nearestNode(nodes, b);
    if (A.dist > 300 || B.dist > 300) throw new Error('One of the points is more than 300 m from any walkable way.');
    return astar(A.node, B.node, o);
  };
  const r = find(opt);
  if (r) return r;
  if (opt.stepFree) {
    let withSteps = null;
    try { withSteps = find({ ...opt, stepFree: false }); } catch { /* ignore */ }
    if (withSteps) throw new Error('No step-free route exists between these points in the data (a route with stairs does).');
  }
  throw new Error('No walking connection found inside this area.');
}

/* ---------- 9. Origin / destination: search boxes first, map clicks as an option ---------- */
const fromEl = document.getElementById('from'), toEl = document.getElementById('to');
const optSteps = document.getElementById('optSteps'), optHills = document.getElementById('optHills');
const inputOf = which => (which === 'A' ? fromEl : toEl);
const pts = { A: null, B: null }, markers = {};
let routeLine = null, lastGeocode = 0;
const COORDS = /^\s*(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function clearRouteLine() { if (routeLine) { routeLayer.removeLayer(routeLine); routeLine = null; } }

function dropMarker(which) {
  if (markers[which]) { routeLayer.removeLayer(markers[which]); markers[which] = null; }
}

function setPoint(which, latlng, text) {
  dropMarker(which);
  pts[which] = latlng;
  markers[which] = L.marker(latlng, { title: which }).addTo(routeLayer)
    .bindTooltip(which, { permanent: true, direction: 'top' });
  inputOf(which).value = text;
  clearRouteLine();
}

function clearPoint(which) {
  dropMarker(which); pts[which] = null; inputOf(which).value = ''; clearRouteLine();
}

// Editing a box invalidates the point that was set from it.
for (const which of ['A', 'B']) {
  inputOf(which).addEventListener('input', () => { dropMarker(which); pts[which] = null; clearRouteLine(); });
}

// Nominatim, biased (not restricted) to what is on screen so "Main St" resolves in the city you are viewing.
async function geocodeNear(text) {
  const wait = lastGeocode + 1100 - Date.now(); // Nominatim allows 1 request per second
  if (wait > 0) await sleep(wait);
  lastGeocode = Date.now();
  const b = map.getBounds();
  const view = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
  const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&viewbox=' + view +
    '&q=' + encodeURIComponent(text), { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('Geocoding failed (' + res.status + ')');
  const hits = await res.json();
  if (!hits.length) throw new Error('Could not find “' + text + '”.');
  return L.latLng(+hits[0].lat, +hits[0].lon);
}

async function resolve(which) {
  if (pts[which]) return pts[which];
  const text = inputOf(which).value.trim();
  if (!text) throw new Error('Enter ' + (which === 'A' ? 'an origin' : 'a destination') + ', or turn on “Pick on map”.');
  const m = text.match(COORDS);
  const ll = m ? L.latLng(+m[1], +m[2]) : await geocodeNear(text);
  setPoint(which, ll, text);
  return ll;
}

async function doRoute() {
  try {
    setBusy(true, 'Finding places…');
    const a = await resolve('A'), b = await resolve('B');
    setBusy(true, 'Downloading the walkable network and routing…');
    const opt = { stepFree: optSteps.checked, hills: optHills.checked };
    const r = await computeRoute(a, b, opt);
    clearRouteLine();
    routeLine = L.polyline(r.path.map(n => [n.lat, n.lon]), { color: '#0b6ef3', weight: 6, opacity: 0.85 }).addTo(routeLayer);
    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
    const mins = Math.max(1, Math.round(r.seconds / 60));
    const flags = [opt.stepFree && 'step-free', opt.hills && 'hill-aware'].filter(Boolean).join(', ');
    setBusy(false, `Route: ${(r.meters / 1000).toFixed(2)} km, about ${mins} min on foot${flags ? ' (' + flags + ')' : ''}.`);
  } catch (err) {
    setBusy(false, err.message);
  }
}

for (const el of [optSteps, optHills]) el.addEventListener('change', () => { if (pts.A && pts.B) doRoute(); });

document.getElementById('routeForm').addEventListener('submit', e => { e.preventDefault(); doRoute(); });

document.getElementById('swap').addEventListener('click', () => {
  const a = pts.A, b = pts.B, ta = fromEl.value, tb = toEl.value;
  clearPoint('A'); clearPoint('B');
  if (b) setPoint('A', b, tb); else fromEl.value = tb;
  if (a) setPoint('B', a, ta); else toEl.value = ta;
  if (pts.A && pts.B) doRoute();
});

// Optional: click the map to set A, then B (a third click starts over).
document.getElementById('pick').addEventListener('click', e => {
  routeMode = !routeMode;
  e.currentTarget.classList.toggle('active', routeMode);
  map.getContainer().classList.toggle('routing', routeMode);
  statusEl.textContent = routeMode ? 'Click the map to set A, then B.' : 'Pick on map is off.';
});

map.on('click', e => {
  if (!routeMode) return;
  map.closePopup();
  if (pts.A && pts.B) { clearPoint('A'); clearPoint('B'); }
  const which = pts.A ? 'B' : 'A';
  setPoint(which, e.latlng, e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5));
  if (pts.A && pts.B) doRoute();
  else statusEl.textContent = which === 'A' ? 'Now click the destination (B).' : 'Now click the origin (A).';
});

/* ---------- 10. Autoload the overview on page load ---------- */
(async () => {
  try {
    setBusy(true, 'Loading local path data…');
    const ways = await queryByArea();          // all pedestrian ways in data/city.json
    const counts = draw(ways);
    const pts = ways.flatMap(w => w.bounds ? [[w.bounds.minlat, w.bounds.minlon], [w.bounds.maxlat, w.bounds.maxlon]] : []);
    if (pts.length) map.fitBounds(pts);
    setBusy(false, summary(counts));
  } catch (err) {
    setBusy(false, err.message);
  }
})();
</script>
</body>
